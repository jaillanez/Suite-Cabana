[project]
name = "suite-cabana-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "pydantic-settings>=2.6",
  "pydantic[email]>=2.9",
  "pwdlib[argon2]>=0.2",
  "pyjwt[crypto]>=2.9",  # crypto: verificar la firma RS256 de los tokens de Google
  "httpx>=0.27",
  "pillow>=11",  # optimización de fotos (docs/01 §5 R2)
  "python-multipart>=0.0.9",  # subida de archivos
  "icalendar>=6",  # sincronización de calendarios con Booking y Airbnb
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
